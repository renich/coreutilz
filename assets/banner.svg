<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient that matches GitHub/GitLab Dark Theme -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Zig Amber Gradient -->
    <linearGradient id="zig-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7a41d"/>
      <stop offset="50%" stop-color="#ffbe53"/>
      <stop offset="100%" stop-color="#f78c1d"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Subtle Dot Pattern -->
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" fill-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="240" rx="12" fill="url(#bg)"/>
  <rect width="1200" height="240" rx="12" fill="url(#dot-grid)"/>
  <rect width="1198" height="238" x="1" y="1" rx="11" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Subtle Accent Circuit Lines -->
  <g opacity="0.3">
    <path d="M 40 40 L 160 40 L 190 70 L 320 70" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="40" cy="40" r="2.5" fill="#00e5ff"/>
    <circle cx="320" cy="70" r="2.5" fill="#00e5ff"/>

    <path d="M 1160 200 L 1040 200 L 1010 170 L 960 170" fill="none" stroke="#f7a41d" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="1160" cy="200" r="2.5" fill="#f7a41d"/>
    <circle cx="960" cy="170" r="2.5" fill="#f7a41d"/>
  </g>

  <!-- Left: Stylized Zig Kinetic Mark -->
  <g transform="translate(80, 36)">
    <!-- Geometric Outer Shield Hexagon -->
    <polygon points="80,5 155,48 155,134 80,177 5,134 5,48" fill="#161b22" stroke="#30363d" stroke-width="2"/>
    <polygon points="80,13 147,51 147,126 80,165 13,126 13,51" fill="none" stroke="url(#zig-amber)" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Authentic Zig-styled Sharp Z Glyph -->
    <path d="M 42 52 L 118 52 L 98 78 L 72 78 L 44 114 L 118 114" fill="none" stroke="url(#zig-amber)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Kinetic Terminal Nodes -->
    <circle cx="42" cy="52" r="5" fill="#f7a41d"/>
    <circle cx="118" cy="114" r="5" fill="#00e5ff"/>
  </g>

  <!-- Right: Typography & Project Identity -->
  <g transform="translate(285, 48)">
    <!-- Title -->
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="54" letter-spacing="4" fill="url(#title-grad)">COREUTILZ</text>

    <!-- Version & Toolchain Pill -->
    <rect x="380" y="16" width="124" height="28" rx="14" fill="#21262d" stroke="#f7a41d" stroke-width="1"/>
    <text x="442" y="35" font-family="-apple-system, BlinkMacSystemFont, monospace" font-size="12" font-weight="700" fill="#f7a41d" text-anchor="middle">ZIG 0.16.0</text>

    <!-- Primary Subtitle -->
    <text x="2" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-weight="500" font-size="20" fill="#e6edf3">
      The 100% GNU-Compatible Coreutils in Zig
    </text>

    <!-- Engineering Philosophy Bullet Strip with Vector Dot Dividers -->
    <g transform="translate(2, 120)">
      <circle cx="4" cy="-4" r="3.5" fill="#22c55e"/>
      <text x="14" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, monospace" font-size="14" fill="#8b949e">100% Upstream Parity (259 Tests)</text>

      <circle cx="260" cy="-4" r="3" fill="#38bdf8"/>
      <text x="270" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, monospace" font-size="14" fill="#8b949e">Zero Dependencies</text>

      <circle cx="425" cy="-4" r="3" fill="#f7a41d"/>
      <text x="435" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, monospace" font-size="14" fill="#8b949e">Sub-Second Builds</text>

      <circle cx="585" cy="-4" r="3" fill="#a855f7"/>
      <text x="595" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, monospace" font-size="14" fill="#8b949e">5.7 MB Multicall</text>
    </g>
  </g>
</svg>
